name: 50-Day Cloud Autopilot Publisher (2x Daily)

on:
  schedule:
    # 12:00 PM IST (06:30 AM UTC) - Lunch Peak
    - cron: '30 6 * * *'
    # 08:00 PM IST (02:30 PM UTC) - Evening Prime Scroll Peak
    - cron: '30 14 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub web UI

permissions:
  contents: write

jobs:
  publish_post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install edge-tts pillow python-dotenv requests scipy numpy

      - name: Run Cloud Autopilot Engine
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: |
          python cloud_autopilot_runner.py

      - name: Commit Updated Publish Log
        run: |
          git config --global user.name "TheWealthBlueprint Cloud Bot"
          git config --global user.email "bot@thewealthblueprint.com"
          git add published_videos/published_history.json
          git commit -m "Auto-published video via cloud runner [skip ci]" || echo "No changes to commit"
          git push
