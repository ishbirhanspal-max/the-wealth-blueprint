name: 50-Day Cloud Autopilot Publisher (3x Daily)

on:
  schedule:
    # 09:00 AM IST (03:30 AM UTC) - Morning Commute
    - cron: '30 3 * * *'
    # 01:30 PM IST (08:00 AM UTC) - Lunch Break Peak
    - cron: '0 8 * * *'
    # 08:30 PM IST (03:00 PM UTC) - Evening Prime Scroll Peak
    - cron: '0 15 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub web UI

permissions:
  contents: write

jobs:
  publish_post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-freefont-ttf

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Cloud Autopilot Engine
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
          INSTAGRAM_SESSION_JSON: ${{ secrets.INSTAGRAM_SESSION_JSON }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: |
          python cloud_autopilot_runner.py

      - name: Commit Updated Publish Log
        run: |
          git config --global user.name "TheWealthBlueprint Cloud Bot"
          git config --global user.email "bot@thewealthblueprint.com"
          git add published_videos/published_history.json dynamic_catalog.json
          git commit -m "Auto-published video and replenished catalog [skip ci]" || echo "No changes to commit"
          git push
